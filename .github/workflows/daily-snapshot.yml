name: daily-snapshot

on:
  schedule:
    # 02:17 UTC — off the hour to dodge scraping rush & shared-runner contention.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot date (YYYY-MM-DD). Blank = today."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run snapshot
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m nightingale.cli --date "${{ inputs.date }}"
          else
            python -m nightingale.cli
          fi

      - name: Commit artifacts
        run: |
          git config user.name  "nightingale-bot"
          git config user.email "nightingale-bot@users.noreply.github.com"
          git add data/snapshots reports
          if git diff --cached --quiet; then
            echo "No new snapshot changes to commit."
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d)"
            git push
          fi
