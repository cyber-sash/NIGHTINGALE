name: daily-snapshot

on:
  schedule:
    # 02:17 UTC — off the hour to dodge scraping rush & shared-runner contention.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot date (YYYY-MM-DD). Blank = today."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run snapshot
        env:
          # Override at the repo/org level (Settings → Secrets and
          # variables → Actions → Variables) if a target site requires
          # a different UA to stop returning 403. Defaults to a realistic
          # Chrome UA baked into the harness.
          NIGHTINGALE_UA: ${{ vars.NIGHTINGALE_UA }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m nightingale.cli --date "${{ inputs.date }}"
          else
            python -m nightingale.cli
          fi

      - name: Upload raw HTML for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-html-${{ inputs.date || 'today' }}
          path: data/raw/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit artifacts
        run: |
          git config user.name  "nightingale-bot"
          git config user.email "nightingale-bot@users.noreply.github.com"
          git add data/snapshots reports
          if git diff --cached --quiet; then
            echo "No new snapshot changes to commit."
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d)"
            git push
          fi
